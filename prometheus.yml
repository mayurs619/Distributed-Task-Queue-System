global:
  scrape_interval: 5s

scrape_configs:

  - job_name: 'producer-api'
    metrics_path: '/actuator/prometheus'

    static_configs:
      - targets:
          - 'producer-api:8080'

  - job_name: 'worker-service'
    metrics_path: '/actuator/prometheus'

    static_configs:
      - targets:
          - 'worker-service:8080'